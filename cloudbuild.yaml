# Google Cloud Build configuration: https://cloud.google.com/cloud-build/docs/build-config
# Image building process: https://git.k8s.io/test-infra/config/jobs/image-pushing/README.md

# this must be specified in seconds. If omitted, defaults to 600s (10 mins)
timeout: 1200s

options:
  substitution_option: ALLOW_LOOSE
  machineType: E2_HIGHCPU_32

steps:
- name: 'gcr.io/cloud-builders/docker'
  entrypoint: make
  env:
  - GIT_TAG=$_GIT_TAG
  - PULL_BASE_REF=$_PULL_BASE_REF
  - CLOUDBUILD_REPO=$PROJECT_ID
  args:
  - image-push

- name: 'gcr.io/gcp-runtimes/container-structure-test'
  id: structure-test
  args:
  - test
  - --image=gcr.io/$PROJECT_ID/kpromo:$_GIT_TAG
  - --config=container-structure.yaml

substitutions:
  # _GIT_TAG will be filled with a git-based tag for the image, of the form
  # vYYYYMMDD-hash, and can be used as a substitution
  _GIT_TAG: '12345'
  # The branch or release tag the job runs for, passed by the image builder
  # with --env-passthrough=PULL_BASE_REF. Release tags (vX.Y.Z) push the
  # image tag vX.Y.Z-0 instead of latest, see hack/cip-image.sh.
  _PULL_BASE_REF: 'dev'

tags:
- 'kpromo'
- ${_GIT_TAG}
- ${_PULL_BASE_REF}

images:
- 'gcr.io/$PROJECT_ID/kpromo:$_GIT_TAG'
